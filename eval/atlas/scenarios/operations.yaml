- id: crm_pipeline_value
  tenant: acme
  split: heldout
  tags: [crm, single]
  turns:
    - user: "What is our open sales pipeline by stage, including the probability weighted value?"
      gold_sql: |
        SELECT stage, COUNT(*) AS opportunities, SUM(estimated_value) AS value,
               SUM(estimated_value * probability_percent / 100.0) AS weighted_value
        FROM crm_opportunities WHERE stage NOT IN ('WON','LOST') GROUP BY stage

