# HR, CRM, projects, manufacturing, quality, maintenance and hospitality scenarios.
# Hospitality demo data is stamped with the real clock date, so no relative-date questions there.
# As-of date for the others: 2026-07-06.

- id: hr_team_chain_6
  tenant: acme
  split: dev
  tags: [hr, multi_turn, six_turn]
  turns:
    - user: "How many active employees do we have?"
      gold_sql: |
        SELECT COUNT(*) AS headcount FROM hr_employees WHERE status = 'ACTIVE'
    - user: "List them with their department and job title."
      gold_sql: |
        SELECT e.first_name, e.last_name, d.name AS department, p.title
        FROM hr_employees e LEFT JOIN hr_departments d ON d.id = e.department_id LEFT JOIN hr_positions p ON p.id = e.position_id
        WHERE e.status = 'ACTIVE'
    - user: "Which of them have submitted leave requests?"
      gold_sql: |
        SELECT DISTINCT e.first_name, e.last_name
        FROM hr_employees e JOIN hr_leave_requests r ON r.employee_id = e.id
        WHERE e.status = 'ACTIVE'
    - user: "How many leave days have they requested in total?"
      gold_sql: |
        SELECT SUM(r.days) AS total_days
        FROM hr_leave_requests r JOIN hr_employees e ON e.id = r.employee_id WHERE e.status = 'ACTIVE'
    - user: "Break that down by leave type."
      gold_sql: |
        SELECT t.name AS leave_type, SUM(r.days) AS days
        FROM hr_leave_requests r JOIN hr_leave_types t ON t.id = r.leave_type_id JOIN hr_employees e ON e.id = r.employee_id
        WHERE e.status = 'ACTIVE' GROUP BY t.name
    - user: "Who requested the most days?"
      gold_sql: |
        SELECT e.first_name, e.last_name, SUM(r.days) AS days
        FROM hr_leave_requests r JOIN hr_employees e ON e.id = r.employee_id
        WHERE e.status = 'ACTIVE' GROUP BY e.id, e.first_name, e.last_name ORDER BY days DESC, e.last_name LIMIT 1

- id: hr_project_hours_4
  tenant: professional-services
  split: heldout
  tags: [hr, projects, multi_turn]
  turns:
    - user: "How many hours were logged on each project?"
      gold_sql: |
        SELECT p.code, p.name, SUM(te.hours) AS hours
        FROM hr_time_entries te JOIN ps_projects p ON p.id = te.project_id GROUP BY p.code, p.name
    - user: "How many of those hours were billable?"
      gold_sql: |
        SELECT p.code, SUM(CASE WHEN te.is_billable THEN te.hours ELSE 0 END) AS billable_hours
        FROM hr_time_entries te JOIN ps_projects p ON p.id = te.project_id GROUP BY p.code
    - user: "Which project has the most hours?"
      gold_sql: |
        SELECT p.code, p.name, SUM(te.hours) AS hours
        FROM hr_time_entries te JOIN ps_projects p ON p.id = te.project_id
        GROUP BY p.code, p.name ORDER BY hours DESC, p.code LIMIT 1
    - user: "Which employees logged time on it?"
      gold_sql: |
        SELECT e.first_name, e.last_name, SUM(te.hours) AS hours
        FROM hr_time_entries te JOIN hr_timesheets ts ON ts.id = te.timesheet_id JOIN hr_employees e ON e.id = ts.employee_id
        WHERE te.project_id = (SELECT te2.project_id FROM hr_time_entries te2 JOIN ps_projects p2 ON p2.id = te2.project_id
                               GROUP BY te2.project_id, p2.code ORDER BY SUM(te2.hours) DESC, p2.code LIMIT 1)
        GROUP BY e.id, e.first_name, e.last_name

- id: mfg_gadget_chain_4
  tenant: acme
  split: dev
  tags: [manufacturing, multi_turn]
  turns:
    - user: "Show the production orders with their item, quantity and status."
      gold_sql: |
        SELECT o.order_number, i.item_code, i.name, o.quantity, o.status
        FROM mfg_production_orders o JOIN inv_items i ON i.id = o.item_id
    - user: "Which one produced the most units?"
      gold_sql: |
        SELECT o.order_number, i.item_code, o.finished_quantity
        FROM mfg_production_orders o JOIN inv_items i ON i.id = o.item_id
        ORDER BY o.finished_quantity DESC, o.order_number LIMIT 1
    - user: "What components does that product need per unit?"
      gold_sql: |
        SELECT ci.item_code, ci.name, c.quantity_per
        FROM mfg_bom_components c JOIN mfg_boms b ON b.id = c.bom_id JOIN inv_items ci ON ci.id = c.component_item_id
        WHERE b.item_id = (SELECT o.item_id FROM mfg_production_orders o ORDER BY o.finished_quantity DESC, o.order_number LIMIT 1)
    - user: "How much of each component does a run of that size consume?"
      gold_sql: |
        SELECT ci.item_code, c.quantity_per * (SELECT o.finished_quantity FROM mfg_production_orders o ORDER BY o.finished_quantity DESC, o.order_number LIMIT 1) AS required
        FROM mfg_bom_components c JOIN mfg_boms b ON b.id = c.bom_id JOIN inv_items ci ON ci.id = c.component_item_id
        WHERE b.item_id = (SELECT o.item_id FROM mfg_production_orders o ORDER BY o.finished_quantity DESC, o.order_number LIMIT 1)

- id: hsp_ticket_chain_3
  tenant: hospitality
  split: heldout
  tags: [hospitality, multi_turn]
  turns:
    - user: "How many order tickets are there in each status?"
      gold_sql: |
        SELECT status, COUNT(*) AS tickets FROM hsp_order_tickets GROUP BY status
    - user: "What was ordered on the settled ones?"
      gold_sql: |
        SELECT i.name, l.quantity, l.line_amount
        FROM hsp_order_ticket_lines l JOIN hsp_order_tickets t ON t.id = l.ticket_id JOIN inv_items i ON i.id = l.item_id
        WHERE t.status = 'SETTLED'
    - user: "What is the total value of those items?"
      gold_sql: |
        SELECT SUM(l.line_amount) AS total_value
        FROM hsp_order_ticket_lines l JOIN hsp_order_tickets t ON t.id = l.ticket_id WHERE t.status = 'SETTLED'

