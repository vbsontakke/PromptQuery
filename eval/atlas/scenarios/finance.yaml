- id: fin_overdue_list
  tenant: acme
  split: heldout
  tags: [finance, single]
  turns:
    - user: "List all overdue customer invoices with the number of days overdue, most overdue first."
      gold_sql: |
        SELECT i.invoice_number, i.partner_name, i.due_date, DATE '2026-07-06' - i.due_date AS days_overdue, i.open_amount
        FROM fin_customer_invoices i
        WHERE i.status IN ('POSTED','PARTIALLY_PAID') AND i.open_amount > 0 AND i.due_date < DATE '2026-07-06'
        ORDER BY days_overdue DESC, i.invoice_number
      compare: {order: false}

