- id: fin_gross_profit
  tenant: retail
  split: dev
  tags: [finance, single]
  turns:
    - user: "What is our gross profit?"
      gold_sql: |
        SELECT COALESCE(SUM(CASE WHEN a.account_type = 'REVENUE' THEN l.functional_credit_amount - l.functional_debit_amount END), 0)
             - COALESCE(SUM(CASE WHEN a.id IN (SELECT cogs_account_id FROM inv_item_categories) THEN l.functional_debit_amount - l.functional_credit_amount END), 0) AS gross_profit
        FROM fin_journal_lines l JOIN fin_accounts a ON a.id = l.account_id WHERE l.is_posted

